[package]
name = "rustvani"
version = "0.1.0"
edition = "2026"
license = "BSD-2-Clause"
license-file = "LICENSE"

# ---------------------------------------------------------------------------
# Binaries
# ---------------------------------------------------------------------------

[[bin]]
name = "pipeline_test"
path = "src/bin/pipeline_test.rs"

[[bin]]
name = "ravi_server"
path = "src/bin/ravi_server.rs"

[[bin]]
name = "sarvam_ws_test"
path = "src/bin/sarvam_ws_test.rs"

[[bin]]
name = "sarvam_test"
path = "src/bin/sarvam_test.rs"

[[bin]]
name = "sarvam_pipeline_test"
path = "src/bin/sarvam_pipeline_test.rs"

[[bin]]
name = "llm_only_test"
path = "src/bin/llm_only_test.rs"

[[bin]]
name = "websocket_server"
path = "src/bin/websocket_server.rs"

[[bin]]
name = "sarvam_tts_test"
path = "src/bin/sarvam_tts_test.rs"

[[bin]]
name = "websocket_server_piper"
path = "src/bin/websocket_server_piper.rs"

[[bin]]
name = "pizza_voice_server"
path = "src/bin/pizza_voice_server.rs"

[[bin]]
name = "agent_text_demo"
path = "src/bin/agent_text_demo.rs"

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------

[dependencies]
tokio           = { version = "1",        features = ["full"] }
tokio-util      = { version = "0.7",      features = ["rt"] }
async-trait     = "0.1"
async-recursion = "1"
thiserror       = "1"
futures         = "0.3"
log             = "0.4"
env_logger      = "0.11"
nnnoiseless     = "0.1"
rubato          = "0.14"

# ONNX Runtime — for Silero VAD
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "download-binaries"] }
ndarray = "0.16"

# Audio
hound           = "3"

# HTTP server (websocket_server binary)
axum            = { version = "0.7", features = ["ws"] }
tower-http      = { version = "0.5", features = ["cors"] }

# WebSocket client (STT + TTS services)
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }

# Serialisation
serde           = { version = "1.0.228", features = ["derive"] }
serde_json      = "1.0.149"
base64          = "0.22.1"

# HTTP client (LLM service)
reqwest         = { version = "0.12", features = ["json", "stream", "native-tls"] }

# Postgres (Neon DB tool)
tokio-postgres      = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4", "with-uuid-1"] }
postgres-native-tls = "0.5"
native-tls          = "0.2"
chrono          = { version = "0.4", features = ["serde"] }
uuid            = { version = "1",   features = ["serde", "v4"] }
dotenvy         = "0.15"

# ---------------------------------------------------------------------------
# Dev dependencies
# ---------------------------------------------------------------------------

[dev-dependencies]
tokio      = { version = "1", features = ["full", "test-util"] }
env_logger = "0.11"
