# fly.toml app configuration file generated for rustvani-interview on 2026-05-14T15:32:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rustvani-interview'
primary_region = 'bom'

[build]

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
